<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bỏ vào thùng nào?</title>
<!-- TensorFlow.js tu phuc vu tu Vercel, khong phu thuoc CDN ben ngoai -->
<script src="lib/tf.min.js"></script>
<style>
  :root {
    --primary: #2e7d32; --primary-dark: #1b5e20;
    --bg: #f4f7f4; --card: #fff; --text: #1a1a1a; --muted: #6b7280;
    --warn: #b45309; --warn-bg: #fffbeb;
    --danger: #b91c1c; --danger-bg: #fef2f2;
    /* Mau rieng cho tung nhom rac - giong mau thung rac phan loai */
    --huu-co: #2e7d32; --huu-co-bg: #f0f8f0;
    --tai-che: #1d4ed8; --tai-che-bg: #eff4ff;
    --khong-tai-che: #4b5563; --khong-tai-che-bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 60px; min-height: 100vh;
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { color: var(--primary-dark); margin: 0 0 4px; font-size: 1.6rem; }
  header p { color: var(--muted); margin: 0; font-size: .95rem; }
  main { width: 100%; max-width: 720px; }

  #khung-tha {
    background: var(--card); border: 2px dashed #c8d6c8; border-radius: 20px;
    padding: 46px 24px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #khung-tha:hover { border-color: var(--primary); background: #fafdfa; }
  #khung-tha.dragover { border-color: var(--primary); background: #e8f5e9; }
  #khung-tha .icon { font-size: 3rem; }
  #khung-tha .chinh { font-size: 1.2rem; font-weight: 600; margin: 14px 0 6px; }
  #khung-tha .phu { color: var(--muted); font-size: .9rem; }

  #hang-nut { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 999px; cursor: pointer; font-size: 1rem; padding: 13px 26px; transition: background .15s, transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-chinh { background: var(--primary); color: #fff; font-weight: 600; }
  .btn-chinh:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-phu { background: transparent; color: var(--muted); border: 1px solid #d3dbd3; }
  .btn-phu:hover:not(:disabled) { color: var(--text); border-color: #aab5aa; }
  .btn-tat { background: var(--danger); color: #fff; font-weight: 600; }

  #khu-ket-qua { display: none; }
  #khu-ket-qua.hien { display: block; }
  #the { background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
  #khung-anh { background: #eef2ee; display: flex; justify-content: center; }
  #khung-anh img, #khung-anh video { width: 100%; max-height: 300px; object-fit: contain; display: block; }
  #phan-dap-an { padding: 24px; border-left: 6px solid var(--primary); }
  #phan-dap-an.huu-co { border-left-color: var(--huu-co); background: var(--huu-co-bg); }
  #phan-dap-an.tai-che { border-left-color: var(--tai-che); background: var(--tai-che-bg); }
  #phan-dap-an.khong-tai-che { border-left-color: var(--khong-tai-che); background: var(--khong-tai-che-bg); }
  #phan-dap-an.canh-bao { border-left-color: var(--warn); background: var(--warn-bg); }
  #phan-dap-an.nguy-hiem { border-left-color: var(--danger); background: var(--danger-bg); }
  #nhan { font-size: 2rem; font-weight: 700; margin: 0 0 6px; color: var(--primary-dark); line-height: 1.15; }
  #phan-dap-an.huu-co #nhan { color: var(--huu-co); }
  #phan-dap-an.tai-che #nhan { color: var(--tai-che); }
  #phan-dap-an.khong-tai-che #nhan { color: var(--khong-tai-che); }
  #phan-dap-an.canh-bao #nhan { color: var(--warn); }
  #phan-dap-an.nguy-hiem #nhan { color: var(--danger); }
  #vi-du { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }
  #vi-du:empty { display: none; }
  #huong-dan { font-size: 1.05rem; line-height: 1.55; margin: 0; }
  #do-chac { color: var(--muted); font-size: .85rem; margin-top: 12px; }

  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 10px 4px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .dong { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: .88rem; color: var(--muted); }
  .dong .ten { width: 160px; flex-shrink: 0; }
  .dong .nen { flex: 1; height: 6px; background: #e3e8e3; border-radius: 3px; overflow: hidden; }
  .dong .day { height: 100%; background: #9bb89b; border-radius: 3px; transition: width .3s; }
  .dong .so { width: 52px; text-align: right; }
  .dong.top { color: var(--text); font-weight: 600; }
  .dong.top .day { background: var(--primary); }

  #nut-lai { margin-top: 18px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  footer { margin-top: 30px; font-size: .78rem; color: #9aa39a; text-align: center; max-width: 560px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>♻️ Bỏ vào thùng nào?</h1>
  <p>Chọn một tấm ảnh, biết ngay cách vứt cho đúng</p>
</header>

<main>
  <div id="khung-tha" onclick="document.getElementById('file-input').click()">
    <div class="icon">📷</div>
    <div class="chinh">Kéo ảnh vào đây</div>
    <div class="phu">hoặc bấm để chọn ảnh từ máy</div>
  </div>
  <div id="hang-nut">
    <button class="btn btn-chinh" onclick="document.getElementById('file-input').click()">Chọn ảnh</button>
    <button class="btn btn-phu" id="nut-cam" onclick="gatCamera()">Dùng camera</button>
  </div>
  <input type="file" id="file-input" accept="image/*" hidden onchange="chonAnh(this.files[0]); this.value='';">

  <div id="khu-ket-qua">
    <div id="the">
      <div id="khung-anh"></div>
      <div id="phan-dap-an">
        <p id="nhan">—</p>
        <p id="vi-du"></p>
        <p id="huong-dan"></p>
        <div id="do-chac"></div>
      </div>
    </div>
    <details id="chi-tiet"><summary>Xem chi tiết 4 nhóm</summary><div id="khung-nhan"></div></details>
    <div id="nut-lai">
      <button class="btn btn-chinh" onclick="document.getElementById('file-input').click()">Thử ảnh khác</button>
      <button class="btn btn-phu" id="nut-cam-2" onclick="gatCamera()">Dùng camera</button>
    </div>
  </div>
</main>

<footer id="chan">
  Phân 4 nhóm: hữu cơ · tái chế · không thể tái chế · nguy hại<br>
  AI chạy ngay trên máy bạn — ảnh không được gửi đi đâu. Khi hiện "Chưa chắc" thì đừng tin kết quả.
</footer>

<script>
  // Model Teachable Machine 4 nhom chay ngay trong trinh duyet bang TensorFlow.js
  // (WebGL/GPU) - khong gui anh len server nao. Tang PHIEN_BAN_MODEL khi doi
  // model de trinh duyet khong dung lai ban cu trong cache.
  const PHIEN_BAN_MODEL = "1";
  const MODEL_URL = `tfjs_model/model.json?v=${PHIEN_BAN_MODEL}`;
  const METADATA_URL = `tfjs_model/metadata.json?v=${PHIEN_BAN_MODEL}`;
  const IMAGE_SIZE = 224;
  const NGUONG_TIN_CAY = 0.60;
  // Camera: nhan dien ~4 lan/giay la du muot, ma nhe may va do ton pin hon
  // nhieu so voi chay het 30 khung/giay.
  const CHU_KY_MS = 250;

  // Nhan cua model (labels trong metadata.json) -> nhom rac hien cho nguoi dung.
  // muc: ten class CSS de to mau the ket qua theo nhom.
  const NHOM_RAC = {
    "organic waste":        { ten: "Rác hữu cơ", muc: "huu-co",
                              viDu: "Thức ăn thừa, rau củ quả, vỏ trái cây",
                              viec: "Bỏ vào thùng rác hữu cơ hoặc ủ làm phân compost." },
    "hazardous waste":      { ten: "Rác nguy hại", muc: "nguy-hiem",
                              viDu: "Pin, ắc quy",
                              viec: "Tuyệt đối không bỏ vào rác thường — pin rò rỉ gây ô nhiễm đất và nước. Mang tới điểm thu gom pin cũ, rác nguy hại." },
    "recyclable waste":     { ten: "Rác tái chế", muc: "tai-che",
                              viDu: "Carton, thủy tinh, chai nhựa, giấy, kim loại",
                              viec: "Rửa sạch, để khô, gấp gọn rồi bỏ vào thùng tái chế. Lon, giấy, carton bán ve chai được." },
    "non-recyclable waste": { ten: "Rác không thể tái chế", muc: "khong-tai-che",
                              viDu: "Quần áo, dép, khẩu trang",
                              viec: "Bỏ vào thùng rác còn lại. Quần áo còn mặc được thì nên quyên góp." },
  };

  const $ = id => document.getElementById(id);
  let model = null, nhan = [], dangNap = null;
  let stream = null, dangBatCam = false;

  // Canvas dung chung de cat anh ve 224x224 truoc khi dua vao model.
  const canvasCat = document.createElement("canvas");
  canvasCat.width = canvasCat.height = IMAGE_SIZE;
  const ctxCat = canvasCat.getContext("2d", { willReadFrequently: true });

  /** Nap model 1 lan duy nhat; goi nhieu lan cung chi tai 1 lan. */
  function napModel() {
    if (!dangNap) {
      dangNap = (async () => {
        const [m, meta] = await Promise.all([
          tf.loadLayersModel(MODEL_URL),
          fetch(METADATA_URL).then(r => r.json()),
        ]);
        nhan = meta.labels;
        // Chay thu 1 lan cho GPU bien dich san - lan nhan dien that dau tien
        // se khong bi khung lai.
        tf.tidy(() => m.predict(tf.zeros([1, IMAGE_SIZE, IMAGE_SIZE, 3])));
        model = m;
      })();
      dangNap.catch(() => { dangNap = null; });
    }
    return dangNap;
  }

  /** Giong Teachable Machine: cat vuong o giua, thu ve 224x224, chuan hoa ve [-1, 1].
   *  Tra ve mang xac suat cung thu tu voi `nhan`. */
  function duDoan(nguon, rong, cao) {
    const canh = Math.min(rong, cao);
    ctxCat.drawImage(nguon, (rong - canh) / 2, (cao - canh) / 2, canh, canh, 0, 0, IMAGE_SIZE, IMAGE_SIZE);
    return tf.tidy(() => {
      const anh = tf.browser.fromPixels(canvasCat).toFloat().div(127.5).sub(1).expandDims(0);
      return model.predict(anh).dataSync();
    });
  }

  function moKetQua() { $("khung-tha").style.display = "none"; $("hang-nut").style.display = "none"; $("khu-ket-qua").classList.add("hien"); }
  function veRong() { $("khung-tha").style.display = ""; $("hang-nut").style.display = ""; $("khu-ket-qua").classList.remove("hien"); }

  function bao(tieuDe, noiDung, muc = "") {
    $("phan-dap-an").className = muc;
    $("nhan").textContent = tieuDe;
    $("vi-du").textContent = "";
    $("huong-dan").textContent = noiDung;
    $("do-chac").textContent = "";
  }

  // ---------- Camera: nhan dien lien tuc ngay tren may ----------
  function gatCamera() { dangBatCam ? tatCamera() : batCamera(); }

  function capNhatNutCam(bat) {
    [$("nut-cam"), $("nut-cam-2")].forEach(n => {
      n.textContent = bat ? "Tắt camera" : "Dùng camera";
      n.classList.toggle("btn-tat", bat);
      n.classList.toggle("btn-phu", !bat);
    });
  }

  async function batCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch (e) {
      moKetQua(); bao("Không bật được camera", "Bạn cần cho phép quyền camera, và trang phải chạy qua HTTPS hoặc localhost.", "canh-bao");
      return;
    }
    moKetQua();
    const v = document.createElement("video");
    v.autoplay = true; v.playsInline = true; v.muted = true; v.srcObject = stream;
    $("khung-anh").innerHTML = ""; $("khung-anh").appendChild(v);
    dangBatCam = true; capNhatNutCam(true);
    bao("Đưa vật thể vào khung", model ? "Đang nhận diện liên tục, không cần bấm gì." : "Đang tải model (~2 MB), chỉ lần đầu…");
    v.addEventListener("loadedmetadata", () => vongNhanDien(v), { once: true });
  }

  function tatCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    dangBatCam = false; capNhatNutCam(false); veRong();
  }

  async function vongNhanDien(v) {
    try {
      await napModel();
    } catch (e) {
      if (dangBatCam) bao("Không tải được model", "Kiểm tra kết nối mạng rồi tải lại trang.", "canh-bao");
      return;
    }
    while (dangBatCam && stream) {
      if (v.readyState >= 2) hienKetQua(duDoan(v, v.videoWidth, v.videoHeight));
      await new Promise(r => setTimeout(r, CHU_KY_MS));
    }
  }

  // ---------- Chon anh tu may: doc ngay tren may, khong tai len dau ca ----------
  async function chonAnh(file) {
    if (!file) return;
    if (!file.type.startsWith("image/")) { moKetQua(); bao("Không phải file ảnh", "Hãy chọn một file ảnh (.jpg, .png…).", "canh-bao"); return; }
    if (dangBatCam) tatCamera();

    moKetQua();
    const img = new Image();
    img.src = URL.createObjectURL(file);
    $("khung-anh").innerHTML = ""; $("khung-anh").appendChild(img);
    bao("Đang nhận diện…", model ? "" : "Đang tải model (~2 MB), chỉ lần đầu…");

    try {
      await img.decode();
    } catch (e) {
      bao("Không đọc được ảnh", "File có thể bị hỏng. Thử ảnh khác nhé.", "canh-bao");
      return;
    }
    try {
      await napModel();
    } catch (e) {
      bao("Không tải được model", "Kiểm tra kết nối mạng rồi tải lại trang.", "canh-bao");
      return;
    }
    hienKetQua(duDoan(img, img.naturalWidth, img.naturalHeight));
  }

  function hienKetQua(xacSuat) {
    let top = 0;
    xacSuat.forEach((p, i) => { if (p > xacSuat[top]) top = i; });
    const nhom = NHOM_RAC[nhan[top]] || { ten: nhan[top], muc: "tai-che", viDu: "", viec: "" };
    const pct = (xacSuat[top] * 100).toFixed(0);

    if (xacSuat[top] >= NGUONG_TIN_CAY) {
      $("phan-dap-an").className = nhom.muc;
      $("nhan").textContent = nhom.ten;
      $("vi-du").textContent = `Gồm: ${nhom.viDu}`;
      $("huong-dan").textContent = nhom.viec;
      $("do-chac").textContent = `Độ chắc chắn ${pct}%`;
    } else {
      // Khong du tu tin thi noi that, khong doan bua
      $("phan-dap-an").className = "canh-bao";
      $("nhan").textContent = "Chưa chắc";
      $("vi-du").textContent = "";
      $("huong-dan").textContent = `Máy nghiêng về ${nhom.ten.toLowerCase()} nhưng không đủ chắc để khuyên bạn. Đưa vật lại gần, đủ sáng, mỗi lần một vật.`;
      $("do-chac").textContent = `Cao nhất chỉ ${pct}%`;
    }

    const khung = $("khung-nhan");
    khung.innerHTML = "";
    nhan.map((ten, i) => [ten, xacSuat[i] * 100])
      .sort((a, b) => b[1] - a[1])
      .forEach(([ten, p]) => {
        const row = document.createElement("div");
        row.className = "dong" + (ten === nhan[top] ? " top" : "");
        row.innerHTML = `<span class="ten"></span><div class="nen"><div class="day" style="width:${p}%"></div></div><span class="so">${p.toFixed(1)}%</span>`;
        row.querySelector(".ten").textContent = (NHOM_RAC[ten] || { ten }).ten;
        khung.appendChild(row);
      });
  }

  // ---------- Keo tha ----------
  (function () {
    const v = $("khung-tha");
    ["dragenter", "dragover"].forEach(e => v.addEventListener(e, ev => { ev.preventDefault(); v.classList.add("dragover"); }));
    ["dragleave", "drop"].forEach(e => v.addEventListener(e, ev => { ev.preventDefault(); v.classList.remove("dragover"); }));
    v.addEventListener("drop", ev => { const f = ev.dataTransfer.files?.[0]; if (f) chonAnh(f); });
    ["dragover", "drop"].forEach(e => document.body.addEventListener(e, ev => { if (!v.contains(ev.target)) ev.preventDefault(); }));
  })();

  // Tai model ngay khi mo trang, de luc nguoi dung bam thi da san sang.
  napModel().catch(() => {});
</script>

</body>
</html>
